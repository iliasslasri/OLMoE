run_name: dense-32exp4
seed: 6198
dry_run: false
no_pre_train_checkpoint: true
load_path: null

wandb:
  name: ${run_name}
  project: olmoe-1
  entity: iliass-lasri-team
  group: null

model:
  d_model: 1024
  n_heads: 16
  n_layers: 16
  mlp_ratio: 3
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: true
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 4096
  vocab_size: 50280
  embedding_size: 50304
  eos_token_id: 0
  pad_token_id: 1
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

compile: null

optimizer:
  name: adamw
  learning_rate: 4.0e-4
  eps: 1.0e-8
  weight_decay: 0.1
  decay_norm_and_bias: true
  decay_embeddings: true
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  units: steps
  t_warmup: 500
  t_max: 112585
  alpha_f: 0.1

activation_checkpointing: fine_grained

tokenizer:
  identifier: tokenizers/allenai_gpt-neox-olmo-dolma-v1_5.json
  truncate_direction: right

save_folder: runs/${run_name}
remote_save_folder: null
save_overwrite: true

save_interval: 26000
save_interval_ephemeral: null
save_num_checkpoints_to_keep: 1
sharded_checkpointer: olmo_core

save_interval_unsharded: null
save_num_unsharded_checkpoints_to_keep: -1

max_duration: 112585
time_limit: 84600
extra_steps_after_cancel: 0
global_train_batch_size: 16
device_train_microbatch_size: 1

precision: amp_bf16
distributed_strategy: ddp

ddp:
  grad_sync_mode: batch
  find_unused_params: false

fsdp:
  wrapping_strategy: by_block
  precision: mixed
  sharding_strategy: NO_SHARD

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

data:
  pad_direction: right
  num_workers: 0
  drop_last: true
  pin_memory: true
  prefetch_factor: null
  persistent_workers: false
  timeout: 0
  instance_filter:
      repetition_max_period: 13
      repetition_min_period: 1
      repetition_max_count: 32
  paths:
    - data/part-0-00000.npy
    - data/part-0-00001.npy
    - data/part-0-00002.npy

eval_interval: 1000
eval_subset_num_batches: 100
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
  - label: hellaswag
    type: downstream
  - label: piqa
    type: downstream
  - label: arc_easy
    type: downstream
  - label: winogrande
    type: downstream
  - label: boolq
    type: downstream
  - label: mmlu_stem_var
    type: downstream
  - label: mmlu_humanities_var
    type: downstream
  - label: mmlu_social_sciences_var
    type: downstream
  - label: mmlu_other_var
    type: downstream
  - label: mmlu_stem_mc_5shot
    type: downstream
  - label: mmlu_humanities_mc_5shot
    type: downstream
  - label: mmlu_social_sciences_mc_5shot
    type: downstream
  - label: mmlu_other_mc_5shot
    type: downstream
  - label: mmlu_stem_mc_5shot_test
    type: downstream
  - label: mmlu_humanities_mc_5shot_test
    type: downstream
  - label: mmlu_social_sciences_mc_5shot_test
    type: downstream
  - label: mmlu_other_mc_5shot_test
    type: downstream
