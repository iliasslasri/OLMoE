run_name: olmoe-local-debug
seed: 6198
dry_run: false
no_pre_train_checkpoint: true

wandb:
  name: olmoe-local-debug
  project: olmoe-local
  entity: null

model:
  d_model: 128
  n_heads: 4
  n_layers: 2
  mlp_ratio: 1
  weight_tying: false
  alibi: false
  rope: true
  flash_attention: false
  attention_dropout: 0.0
  attention_layer_norm: true
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 512
  vocab_size: 50280
  embedding_size: 50304
  eos_token_id: 0
  pad_token_id: 1
  init_device: cpu
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  moe_top_k: 2
  moe_num_experts: 4
  moe_dropless: false
  moe_mlp_impl: dense
  moe_zloss_weight: null
  moe_loss_weight: null
  moe_log_expert_assignment: false

compile: null

optimizer:
  name: adamw
  learning_rate: 4.0e-4
  eps: 1.0e-8
  weight_decay: 0.1
  decay_norm_and_bias: true
  decay_embeddings: true
  betas:
    - 0.9
    - 0.95
  metrics_log_interval: 1

scheduler:
  name: cosine_with_warmup
  units: tokens
  t_warmup: 1000
  t_max: 50000
  alpha_f: 0.1

tokenizer:
  identifier: tokenizers/allenai_gpt-neox-olmo-dolma-v1_5.json
  truncate_direction: right

save_folder: runs/${run_name}
remote_save_folder: null
save_overwrite: true

save_interval: 100
save_interval_ephemeral: null
save_num_checkpoints_to_keep: 1
sharded_checkpointer: olmo_core

save_interval_unsharded: null
save_num_unsharded_checkpoints_to_keep: -1

load_path: null

max_duration: 10
global_train_batch_size: 2
device_train_microbatch_size: 2

precision: fp32
distributed_strategy: fsdp
fsdp:
  sharding_strategy: FULL_SHARD
  use_orig_params: true

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

eval_interval: 1000
eval_subset_num_batches: 5
device_eval_batch_size: 2
evaluators: []

data:
  pad_direction: right
  num_workers: 0
  drop_last: true
  pin_memory: false
  prefetch_factor: null
  persistent_workers: false
  timeout: 0
  paths:
    - /kaggle/input/datasets/tristanmartin22/olmoe_dataset/part-0-00000.npy
